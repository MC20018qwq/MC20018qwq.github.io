<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心率</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0b0c; color: #fff; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .stage { min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 20px; }
  #bpm { font-size: clamp(110px, 26vw, 260px); font-weight: 700; line-height: .9;
    letter-spacing: -8px; font-variant-numeric: tabular-nums; color: #333338;
    transition: color .2s; }
  #bpm.live { color: #fff; }
  #status { font-size: 13px; color: #7c7c85; letter-spacing: .5px; }
  body.clean #status { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div id="bpm">--</div>
  <div id="status">连接中…</div>
</div>
<script>
(function () {
  var HOST = 'wss://broker.emqx.io:8084/mqtt';
  var TOPIC = 'hrband/a7k3x9';          // 和 APK 里写死的是同一个
  var bpmEl = document.getElementById('bpm');
  var statusEl = document.getElementById('status');
  var ws = null, running = true, ping = 0;

  if (new URLSearchParams(location.search).get('clean') === '1') {
    document.body.classList.add('clean');
  }

  function varint(n) {
    var out = [];
    do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 0x80; out.push(d); } while (n > 0);
    return out;
  }
  function bytes(s) { return Array.prototype.slice.call(new TextEncoder().encode(s)); }
  function str(s) {
    var b = bytes(s);
    return [(b.length >> 8) & 0xFF, b.length & 0xFF].concat(b);
  }
  function packet(type, body) {
    return new Uint8Array([type].concat(varint(body.length), body));
  }
  function send(a) { if (ws && ws.readyState === 1) ws.send(a); }

  function show(text) {
    var v = parseInt(String(text).trim(), 10);
    if (!(v > 0 && v <= 250)) return;
    bpmEl.textContent = v;
    bpmEl.classList.add('live');
    statusEl.textContent = '在线 · ' + new Date().toTimeString().slice(0, 8);
  }

  function handle(type, body) {
    var kind = type & 0xF0;
    if (kind === 0x20) {                       // CONNACK
      if (body.length >= 2 && body[1] !== 0) {
        statusEl.textContent = '服务器拒绝（' + body[1] + '）';
        return;
      }
      statusEl.textContent = '已连接，等心率…';
      send(packet(0x82, [0x00, 0x01].concat(str(TOPIC), [0x00])));
      clearInterval(ping);
      ping = setInterval(function () { send(new Uint8Array([0xC0, 0x00])); }, 30000);
      return;
    }
    if (kind === 0x30) {                       // PUBLISH
      var qos = (type >> 1) & 3;
      var tl = (body[0] << 8) | body[1];
      var off = 2 + tl + (qos > 0 ? 2 : 0);
      if (off <= body.length) {
        show(new TextDecoder().decode(new Uint8Array(body.slice(off))));
      }
    }
  }

  function onFrame(buf) {
    var f = new Uint8Array(buf), i = 0;
    while (i < f.length) {
      var type = f[i++], mult = 1, len = 0, d;
      do {
        if (i >= f.length) return;
        d = f[i++];
        len += (d & 0x7F) * mult;
        mult *= 128;
      } while (d & 0x80);
      var body = f.subarray(i, i + len);
      i += len;
      handle(type, body);
    }
  }

  function connect() {
    ws = new WebSocket(HOST, ['mqtt']);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      var cid = 'hrv-' + Math.random().toString(16).slice(2, 10);
      send(packet(0x10, [0x00, 0x04, 0x4D, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3C]
        .concat(str(cid))));
    };
    ws.onmessage = function (ev) { onFrame(ev.data); };
    ws.onerror = function () {};
    ws.onclose = function () {
      if (!running) return;
      statusEl.textContent = '断开，重连中…';
      setTimeout(connect, 3000);
    };
  }

  connect();

  // 12 秒没数据就变灰
  setInterval(function () {
    var t = statusEl.textContent;
    if (t.indexOf('在线') === 0) {
      var hh = t.slice(-8);
      var now = new Date().toTimeString().slice(0, 8);
      var toSec = function (s) {
        var p = s.split(':');
        return (+p[0]) * 3600 + (+p[1]) * 60 + (+p[2]);
      };
      if (toSec(now) - toSec(hh) > 12) {
        bpmEl.classList.remove('live');
      }
    }
  }, 3000);
})();
</script>
</body>
</html>
